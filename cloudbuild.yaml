steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        IMAGE="asia-south2-docker.pkg.dev/puru-255206/puru1/dviewer"
        # Base tags: sha (always) and latest (always).
        TAGS=("-t" "$${IMAGE}:$${SHORT_SHA}" "-t" "$${IMAGE}:latest")
        # When Cloud Build is triggered by a Puru release tag (puru-vX.Y.Z-pN),
        # add the tag name as an immutable image tag so hospitals can pin to it.
        if [[ -n "$${TAG_NAME}" && "$${TAG_NAME}" == puru-* ]]; then
          TAGS+=("-t" "$${IMAGE}:$${TAG_NAME}")
        fi
        docker build --build-arg APP_CONFIG=config/default.js "$${TAGS[@]}" .
        # Push every tag we built.
        for t in "$${IMAGE}:$${SHORT_SHA}" "$${IMAGE}:latest"; do
          docker push "$${t}"
        done
        if [[ -n "$${TAG_NAME}" && "$${TAG_NAME}" == puru-* ]]; then
          docker push "$${IMAGE}:$${TAG_NAME}"
        fi
options:
  logging: CLOUD_LOGGING_ONLY
