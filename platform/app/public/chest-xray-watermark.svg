<?xml version="1.0" encoding="UTF-8"?>
<!--
  Abstract chest-X-ray watermark for the PuruLanding page.
  Hand-drawn ribcage silhouette (not a real patient scan) — spine +
  8 rib pairs + collarbones + a heart shadow offset to the anatomical
  left. Meant to read at ~5% opacity as a medical texture, not as
  detailed anatomy. Pure vector so it stays crisp on any screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Collarbones (clavicles) -->
  <path d="M 60 90 Q 130 60, 190 95" />
  <path d="M 210 95 Q 270 60, 340 90" />

  <!-- Spine — vertical stack of vertebrae blocks -->
  <g>
    <line x1="200" y1="100" x2="200" y2="430" stroke-width="2.2" />
    <line x1="192" y1="130" x2="208" y2="130" />
    <line x1="192" y1="160" x2="208" y2="160" />
    <line x1="192" y1="190" x2="208" y2="190" />
    <line x1="190" y1="220" x2="210" y2="220" />
    <line x1="190" y1="250" x2="210" y2="250" />
    <line x1="188" y1="280" x2="212" y2="280" />
    <line x1="188" y1="310" x2="212" y2="310" />
    <line x1="188" y1="340" x2="212" y2="340" />
    <line x1="186" y1="370" x2="214" y2="370" />
    <line x1="186" y1="400" x2="214" y2="400" />
  </g>

  <!-- Rib pairs — arc from spine to torso edge, top to bottom -->
  <!-- Each rib: left arc + mirrored right arc -->
  <!-- rib 1 -->
  <path d="M 200 120 Q 130 130, 70 170" />
  <path d="M 200 120 Q 270 130, 330 170" />
  <!-- rib 2 -->
  <path d="M 200 150 Q 120 165, 55 210" />
  <path d="M 200 150 Q 280 165, 345 210" />
  <!-- rib 3 -->
  <path d="M 200 180 Q 115 200, 45 250" />
  <path d="M 200 180 Q 285 200, 355 250" />
  <!-- rib 4 -->
  <path d="M 200 215 Q 110 235, 45 290" />
  <path d="M 200 215 Q 290 235, 355 290" />
  <!-- rib 5 -->
  <path d="M 200 250 Q 110 270, 55 325" />
  <path d="M 200 250 Q 290 270, 345 325" />
  <!-- rib 6 -->
  <path d="M 200 285 Q 115 305, 70 355" />
  <path d="M 200 285 Q 285 305, 330 355" />
  <!-- rib 7 (lower, tighter) -->
  <path d="M 200 320 Q 125 340, 90 380" />
  <path d="M 200 320 Q 275 340, 310 380" />
  <!-- rib 8 -->
  <path d="M 200 355 Q 140 370, 115 400" />
  <path d="M 200 355 Q 260 370, 285 400" />

  <!-- Torso outline (soft) -->
  <path d="M 70 170 Q 40 300, 90 420 Q 200 460, 310 420 Q 360 300, 330 170" opacity="0.5" />

  <!-- Heart shadow — offset to anatomical left (viewer's right on frontal view) -->
  <path
    d="M 175 240
       C 155 220, 130 240, 145 275
       C 155 300, 175 315, 180 335
       C 185 315, 210 300, 215 275
       C 225 245, 200 220, 180 240 Z"
    fill="#ffffff"
    fill-opacity="0.15"
    stroke-width="1.2"
    opacity="0.7"
  />
</svg>
