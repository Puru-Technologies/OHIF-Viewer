<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 32" fill="none">
  <!-- Mark: subtle steel ring + sky dot — one accent color, low chroma -->
  <circle cx="14" cy="16" r="7" stroke="#64748b" stroke-width="1.75" fill="none" />
  <circle cx="14" cy="16" r="2.75" fill="#7dd3fc" />
  <!-- Wordmark: PURU bold white + LABS slate — near-monochrome -->
  <text
    y="22"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-size="18"
    letter-spacing="0.22em"
  >
    <tspan x="32" font-weight="700" fill="#ffffff">PURU</tspan><tspan font-weight="300" fill="#94a3b8"> LABS</tspan>
  </text>
</svg>
